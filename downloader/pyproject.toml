[project]
name = "visdcam-downloader"
version = "0.1.0"
description = "Local desktop tool to browse, download, join, archive and time-lapse CCTV clips stored in Backblaze B2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "b2sdk>=2,<3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "tzdata>=2025.2",
]

[project.scripts]
visdcam-downloader = "visdcam_downloader.__main__:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"
